name: Deploy manual

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install frontend deps
        working-directory: frontend-vite
        run: npm ci

      - name: Build frontend
        working-directory: frontend-vite
        run: npm run build

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v5.1.2
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          SOURCE: .
          TARGET: ${{ secrets.DEPLOY_PATH }}
          ARGS: -avz --delete --exclude='node_modules' --exclude='.git' --exclude='.env' --exclude='backend/tests' --exclude='frontend-vite/node_modules' --exclude='frontend-vite/src'
          SCRIPT_BEFORE_REQUIRED: true
          SCRIPT_BEFORE: |
            whoami
            echo "Starting manual deploy to ${{ secrets.DEPLOY_PATH }}"
          SCRIPT_AFTER: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose down
            docker compose up -d --build
            echo "Deploy complete"
