name: Deploy manual

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # -- Build Frontend ------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-vite/package-lock.json

      - name: Install frontend deps
        working-directory: frontend-vite
        run: npm ci

      - name: Build frontend
        working-directory: frontend-vite
        run: npm run build

      # -- Compile Backend TypeScript -> JS ------------------------------
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Compile TypeScript backend
        working-directory: backend
        run: npx tsc

      # -- Deploy via SSH rsync ------------------------------------------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='backend/node_modules' \
            --exclude='frontend-vite/node_modules' \
            --exclude='frontend-vite/src' \
            --exclude='backend/tests' \
            --exclude='backend/logs' \
            --exclude='backend/uploads' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # -- Post-deploy: migrate + restart PM2 ---------------------------
      - name: Run migrations and restart PM2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" bash << EOF
            set -e
            cd "$DEPLOY_PATH/backend"
            echo "Installing production deps..."
            npm ci --omit=dev
            echo "Running migrations..."
            node migrations/run-migrations.js
            echo "Reloading PM2..."
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
            echo "Deploy complete!"
            pm2 list
          EOF
